replicaCount: 3

image:
  repository: purnaspr/netflix
  tag: 1.0
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 500           #service port
  targetPort: 5000    #application port
  nodePort: 30080     #nodeport "30080" for user acces in browser 

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /
    port: 5000
  initialDelaySeconds: 10
  periodSeconds: 20
  timeoutSeconds: 7
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: 5000
  initialDelaySeconds: 9
  periodSeconds: 5
  timeoutSeconds: 4
  failureThreshold: 3